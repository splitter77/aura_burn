<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Photo</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: none; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; color: #888;
  }
  #pasteBtn {
    font: inherit; font-size: 17px; color: #fff; background: #1c1c1e;
    border: 1px solid #333; border-radius: 14px; padding: 14px 34px;
  }
  #hint { font-size: 13px; color: #555; text-align: center; max-width: 80%; min-height: 1em; }
  #catcher {
    position: fixed; left: 50%; top: 62%; transform: translateX(-50%);
    width: 70%; min-height: 44px; color: transparent; caret-color: transparent;
    border: 1px dashed #333; border-radius: 12px; display: none; outline: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="start">
  <button id="pasteBtn">Coller</button>
  <div id="hint"></div>
  <div id="catcher" contenteditable="true"></div>
</div>

<script>
(() => {
  const ARM_DELAY = 5000;      // ms avant qu'un toucher déclenche la combustion
  const BURN_DURATION = 7000;  // ms de combustion

  const canvas = document.getElementById('gl');
  const start = document.getElementById('start');
  const btn = document.getElementById('pasteBtn');
  const hint = document.getElementById('hint');
  const catcher = document.getElementById('catcher');

  // ---------- WebGL ----------
  const gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: false });
  const vs = `
    attribute vec2 p; varying vec2 vUv;
    void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
  const fs = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D img;
    uniform vec2 res, imgSize;
    uniform float prog, time;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
    }
    float fbm(vec2 p){
      float v = 0., a = .5;
      for (int i = 0; i < 5; i++){ v += a*noise(p); p *= 2.03; a *= .5; }
      return v;
    }

    void main(){
      // image en "cover" plein écran
      float sa = res.x/res.y, ia = imgSize.x/imgSize.y;
      vec2 uv = vUv;
      if (ia > sa) uv.x = .5 + (uv.x-.5)*sa/ia;
      else         uv.y = .5 + (uv.y-.5)*ia/sa;
      vec4 tex = texture2D(img, uv);
      vec3 col = tex.rgb;

      // distance aux bords (0 au bord, ~0.5 au centre), irrégulière
      float m = min(res.x, res.y);
      float dx = min(vUv.x, 1.-vUv.x)*res.x/m;
      float dy = min(vUv.y, 1.-vUv.y)*res.y/m;
      float d = min(dx, dy);
      vec2 q = vUv*vec2(res.x/m, res.y/m);
      float n  = fbm(q*3.5);
      float n2 = fbm(q*14. + 7.);
      d += (n-.5)*.28 + (n2-.5)*.05;

      float diff = d - prog;
      float flick = .75 + .25*noise(q*25. + time*6.);

      // zone roussie avant le front
      float scorch = smoothstep(.10, .0, diff);
      vec3 brown = col*vec3(.55,.38,.22);
      col = mix(col, brown, scorch*.85);
      col *= 1. - .85*smoothstep(.035, .0, diff);

      // front de braise
      float glow = smoothstep(.028, .004, diff) * smoothstep(-.012, .0, diff);
      vec3 ember = mix(vec3(1.,.25,.02), vec3(1.,.8,.35), smoothstep(.015,.0,abs(diff-.006)));
      col += ember*glow*1.8*flick;

      // brûlé : noir avec quelques braises mourantes
      if (diff < -.012){
        float age = -diff;
        float spark = smoothstep(.78, .95, n2) * smoothstep(.12, .0, age) * flick;
        col = vec3(1.,.3,.05)*spark*.9;
      }
      gl_FragColor = vec4(col, 1.);
    }`;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('res'), uImg = U('imgSize'), uProg = U('prog'), uTime = U('time');

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  // ---------- état ----------
  let state = 'idle';          // idle | shown | burning | done
  let shownAt = 0, burnStart = 0, imgW = 1, imgH = 1, raf = 0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth*dpr);
    canvas.height = Math.round(innerHeight*dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', () => { resize(); if (state === 'shown' || state === 'done') draw(); });

  function draw(now = performance.now()){
    let p = -0.1;
    if (state === 'burning' || state === 'done'){
      const t = Math.min((now - burnStart)/BURN_DURATION, 1);
      p = -0.1 + (t*t*.35 + t*.65) * 0.85;   // accélère un peu
      if (t >= 1 && state === 'burning') state = 'done';
    }
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uImg, imgW, imgH);
    gl.uniform1f(uProg, p);
    gl.uniform1f(uTime, now/1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  function loop(now){
    draw(now);
    if (state === 'burning') raf = requestAnimationFrame(loop);
  }

  async function showBlob(blob){
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.src = url;
    await im.decode();
    const max = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), 2048);
    const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    imgW = c.width; imgH = c.height;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);

    start.style.display = 'none';
    catcher.style.display = 'none';
    catcher.blur();
    canvas.style.display = 'block';
    resize();
    state = 'shown';
    shownAt = performance.now();
    draw();
  }

  function reset(){
    cancelAnimationFrame(raf);
    state = 'idle';
    canvas.style.display = 'none';
    start.style.display = 'flex';
    hint.textContent = '';
  }

  // ---------- coller ----------
  btn.addEventListener('click', async () => {
    hint.textContent = '';
    try {
      const items = await navigator.clipboard.read();
      for (const it of items){
        const type = it.types.find(t => t.startsWith('image/'));
        if (type){ await showBlob(await it.getType(type)); return; }
      }
      hint.textContent = "Pas d'image dans le presse-papiers.";
    } catch (e) {
      // repli : zone où l'on colle à la main (appui long → Coller)
      hint.textContent = 'Appuie longuement dans le cadre puis « Coller ».';
      catcher.style.display = 'block';
      catcher.focus();
    }
  });

  document.addEventListener('paste', e => {
    if (state !== 'idle') return;
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (const it of items){
      if (it.type.startsWith('image/')){
        e.preventDefault();
        showBlob(it.getAsFile());
        return;
      }
    }
    e.preventDefault();
    hint.textContent = "Pas d'image dans le presse-papiers.";
  });

  // ---------- toucher → brûler ----------
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'shown' && performance.now() - shownAt >= ARM_DELAY){
      state = 'burning';
      burnStart = performance.now();
      raf = requestAnimationFrame(loop);
    } else if (state === 'done'){
      reset();
    }
  });
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
